services:
  auto-ugid:
    build: .
    image: beiming712/auto-uglink:latest
    container_name: uglink
    restart: unless-stopped
    environment:
      UG_ID: ${UG_ID:?set UG_ID}
      CHECK_INTERVAL: "600"
      CONFIRMATION_DELAY: "20"
      REQUEST_TIMEOUT: "10"
      SOURCE_FAILURE_THRESHOLD: "3"
      NOTIFICATION_MAX_ATTEMPTS: "5"
      NOTIFICATION_BACKOFF: "30"
      NOTIFICATION_DRIVER: hermes
      HERMES_WEBHOOK_URL: http://hermes-host:8644/webhooks/uglink-status
      HERMES_WEBHOOK_SECRET: ${HERMES_WEBHOOK_SECRET:?set HERMES_WEBHOOK_SECRET}
    volumes:
      - ./data:/data
